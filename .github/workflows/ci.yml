name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Xcode 27 verification
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install verification tools
        shell: bash
        run: |
          brew install actionlint gitleaks jq ripgrep xcodegen
          swiftlint_archive="${RUNNER_TEMP}/portable_swiftlint.zip"
          swiftlint_bin_directory="${RUNNER_TEMP}/prismBar-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$swiftlint_archive"
          ./scripts/install-pinned-swiftlint.sh \
            "$swiftlint_archive" \
            c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0 \
            "$swiftlint_bin_directory/swiftlint"
          printf '%s\n' "$swiftlint_bin_directory" >> "$GITHUB_PATH"

      - name: Verify public-safe source and unsigned builds
        shell: bash
        env:
          CI_DERIVED_DATA_DIR: ${{ runner.temp }}/prismBar-DerivedData
        run: ./scripts/ci-verify.sh
