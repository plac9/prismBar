name: prismBar

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  prismBarModules:
    path: .

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N8A5T2PZY9
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NONNULL: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEAD_CODE_STRIPPING: YES
      ENABLE_TESTABILITY: NO
      ONLY_ACTIVE_ARCH: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  prismBar:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: prismBarModules
        product: prismBarCore
      - package: prismBarModules
        product: prismBarAccessibility
      - package: prismBarModules
        product: prismBarEngine
      - package: prismBarModules
        product: prismPluginKit
      - target: prismCalcPluginService
        embed: true
    entitlements:
      path: Config/prismBar.entitlements
    info:
      path: Config/prismBar-Info.plist
      properties:
        CFBundleDisplayName: prismBar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        NSHumanReadableCopyright: Copyright 2026 Patrick LaClair and LaClair Technologies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laclairtech.prismbar
        PRODUCT_NAME: prismBar
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    scheme:
      gatherCoverageData: true
      testTargets:
        - prismBarUITests

  prismCalcPluginService:
    type: xpc-service
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: XPC/prismCalcPluginService
    dependencies:
      - package: prismBarModules
        product: prismPluginKit
      - package: prismBarModules
        product: prismCalcPlugin
    entitlements:
      path: Config/prismCalcPluginService.entitlements
    info:
      path: Config/prismCalcPluginService-Info.plist
      properties:
        CFBundleDisplayName: prismCalc
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        XPCService:
          ServiceType: Application
          RunLoopType: NSRunLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laclairtech.prismbar.plugin.prismcalc
        PRODUCT_NAME: prismCalcPluginService
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES

  prismBarUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/prismBarUITests
    dependencies:
      - target: prismBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laclairtech.prismbar.uitests
        CODE_SIGNING_ALLOWED: NO
